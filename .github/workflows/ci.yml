name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The app test starts the whole backend, so it needs a real PostgreSQL.
    # These values match backend/src/main/resources/application.properties.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leave_tracker
          POSTGRES_USER: leave_user
          POSTGRES_PASSWORD: leave_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leave_user -d leave_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw was created on Windows, so Git stores it as not executable.
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
