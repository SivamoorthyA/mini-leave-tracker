services:
  db:
    image: postgres:16
    container_name: leave-tracker-db
    environment:
      POSTGRES_DB: leave_tracker
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
